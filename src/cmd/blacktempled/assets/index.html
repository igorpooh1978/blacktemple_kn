<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>BlackTemple KN</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main class="shell">
    <h1>BlackTemple KN</h1>
    <p class="status"><span class="dot"></span> Отключено</p>
    <p class="meta">Сервер не выбран</p>
    <button type="button" id="connect" disabled>Подключить</button>
    <ul class="facts">
      <li><span>Server</span><span>Автоматически</span></li>
      <li><span>Routing</span><span>Умный</span></li>
      <li><span>Key</span><span>Нет</span></li>
      <li><span>Geodata</span><span>Нет</span></li>
    </ul>
    <p class="hint">Hello-service. VPN ещё не реализован.</p>
  </main>
  <script src="./app.js"></script>
</body>
</html>
