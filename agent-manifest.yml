schema_version: 1
project: blacktemple_kn
default_branch: main
orchestration: chatgpt-main-dialog

waves:
  current: R6
  frozen_contracts: true
  r4_status: integrated
  r5_status: integrated
  r6_status: in_progress
  engine_vertical_slice: complete
  merge_authorized: false
  next_recommended: ORCHESTRATOR REVIEW
  r51_status: probe_run
  r51_note: read-only KN-1011 probe RUN 2026-09-09; R6 selected hybrid-iptables from that evidence; live smoke NOT RUN
  R4:
    name: Minimal blacktempled + embedded UI + engine vertical slice
    base_sha: 41099b953e8318d2c6115e04521a2f9821627378
    merge_authorized: true
    integrated: true
    parallel: true
    agents: [O, A, B, C, F, G, H, I]
    not_in_wave: [D, E, J, K, L, M]
    branches:
      O: agent/r4/orchestration
      A: agent/r4/runtime-auth
      B: agent/r4/profiles-key
      C: agent/r4/xray-engine
      F: agent/r4/service-supervisor
      G: agent/r4/web-ui
      H: agent/r4/build-package
      I: agent/r4/integration
    notes: R4 integrated. Engine vertical slice complete.
  R5:
    name: routing DNS geodata remote-data hardware probe QEMU lab
    base_sha: 84cc8ad3f2fb48f98473a49ce1bb0a393f09a1d5
    merge_authorized: true
    integrated: true
    parallel: true
    agents: [O, D, E, M, J, I]
    not_in_wave: [A, B, C, F, G, H, K, L]
    branches:
      O: agent/r5/orchestration
      D: agent/r5/routing-geodata
      E: agent/r5/remote-data
      M: agent/r5/kn1011-probe
      J: agent/r5/qemu-lab
      I: agent/r5/integration
    worktrees:
      O: blacktemple_kn-wt/r5-orchestration
      D: blacktemple_kn-wt/r5-routing-geodata
      E: blacktemple_kn-wt/r5-remote-data
      M: blacktemple_kn-wt/r5-kn1011-probe
      J: blacktemple_kn-wt/r5-qemu-lab
    notes: >
      R5 prep integrated. routing planner ready. DNS model ready.
      geodata lifecycle ready. remote lists ready. remote policy ready.
      QEMU gate ready. hardware probe RUN 2026-09-09
      (see docs/hardware/kn-1011-capabilities.md). live routing NOT IMPLEMENTED.
  R6:
    name: hybrid-iptables capture orchestration (no live Apply)
    base_sha: 90379f924d1bca60366423217701ff8e590b502e
    merge_authorized: false
    integrated: false
    parallel: true
    agents: [O, C, D, F, M]
    not_in_wave: [A, B, E, G, H, I, J, K, L]
    branches:
      O: agent/r6/orchestration
      C: agent/r6/xray-engine
      D: agent/r6/routing-capture
      F: agent/r6/service-keenetic
      M: agent/r6/kn1011-harness
    worktrees:
      O: blacktemple_kn-wt/r6-orchestration
      C: blacktemple_kn-wt/r6-xray-engine
      D: blacktemple_kn-wt/r6-routing-capture
      F: blacktemple_kn-wt/r6-service-keenetic
      M: blacktemple_kn-wt/r6-kn1011-harness
    notes: >
      hybrid-iptables selected by KN-1011 hardware evidence (ADR-011).
      IPv4 TCP=REDIRECT UDP=TPROXY backend=iptables/xtables. TUN fallback not primary.
      nft not available. Mihomo not used. DNS first smoke KEENETIC_DIRECT.
      live smoke NOT RUN. blackTempleHardwareSmoke NOT RUN. Do not write SUPPORTED.
      R6-I live Apply is not started. next_recommended is ORCHESTRATOR REVIEW.

ownership:
  A_go_runtime:
    paths: [src/cmd/, src/internal/app/, src/internal/api/, src/internal/auth/]
  B_keys:
    paths: [src/internal/profiles/, src/internal/subscription/, src/internal/keys/, src/internal/countries/, src/internal/servers/]
  C_xray:
    paths: [src/internal/xray/, src/internal/protocols/, third_party/xray.lock.json]
  D_routing:
    paths: [src/internal/routing/, src/internal/dns/, src/internal/geodata/]
  E_lists:
    paths: [src/internal/remotelists/, src/internal/remotepolicy/]
  F_service:
    paths: [src/internal/supervisor/, src/internal/platform/, packaging/init/, packaging/keenetic/]
    notes: >
      F owns packaging/init/** and packaging/keenetic/** inside packaging/.
      H owns the rest of packaging/. Do not edit packaging/control/**.
  G_web:
    paths: [web/]
  H_build:
    paths: [build.ps1, bootstrap.ps1, test.ps1, package.ps1, tools/, packaging/]
    except: [packaging/init/, packaging/keenetic/]
    notes: H owns packaging/** except packaging/init/** (F) and packaging/keenetic/** (F). Do not edit S99blacktemple-kn.
  I_integration:
    paths: [src/internal/connection/, src/internal/atomicfile/]
    notes: atomicfile is the shared durable pointer primitive introduced in R5-I.
  I_updater:
    paths: [src/internal/updater/, scripts/install.sh]
  J_lab:
    paths: [lab/, lab.ps1, .github/workflows/qemu.yml]
  K_security:
    paths: [SECURITY.md, src/internal/auth/, .github/workflows/security.yml]
  L_provider:
    paths: [src/internal/provider/, src/internal/news/, src/internal/support/, src/internal/pairing/]
  M_hardware:
    paths: [router-smoke.ps1, scripts/router-*.sh, docs/hardware/]
    notes: >
      M owns router-smoke.ps1, all scripts/router-*.sh (including router-probe.sh),
      and docs/hardware/**. No other agent edits those paths. R6-I live Apply is not started by M.

shared_freeze:
  paths: [go.mod, go.sum, contracts/, docs/adr/]
  notes: >
    go.mod/go.sum are a shared freeze. Agents must not add Go dependencies without an orchestrator contract gap.
    ADR-001 through ADR-010 must not be edited. ADR-011 is accepted in R6 by agent O only.

rules:
  - agents_must_not_edit_foreign_ownership
  - agents_must_not_merge_main
  - agents_must_not_merge_any_branch
  - contract_changes_require_orchestrator
  - no_force_push_main
  - no_cgo
  - xray_is_pinned_external_binary
  - fail_open_default
  - iptables_prefix_BTKN_
  - ui_lan_only_by_default
  - no_go_mod_deps_without_contract_gap
  - never_use_xkeen_port_1181
  - production_daemon_never_stops_xkeen
