acceptance_criteria:
  - HTTP handlers live under src/internal/api; composition root under src/internal/app; auth under src/internal/auth.
  - GET /health, GET /api/v1/version, GET /api/v1/status match frozen OpenAPI schemas (Status.xray may stay STOPPED / pid null until F/C merge).
