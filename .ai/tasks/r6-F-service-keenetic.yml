acceptance_criteria:
  - packaging/keenetic/** holds Keenetic ndm/netfilter templates for BTKN_ only. Uninstall removes only BTKN_ rules and /opt/blacktemple-kn.
  - Do not touch /opt/bin/xray, /opt/sbin/xray, XKeen init, or XKeen chains. Production supervisor never stops XKeen.
  - Memory AUTO leaves Keenetic swappiness=60. No sysctl -w vm.swappiness. GOMEMLIMIT is not a default.
  - packaging/init/S99blacktemple-kn remains Entware rc.func/init.d. Distinguish restart-vpn vs restart-manager vs full-restart (ADR-004).
  - platform/entware and platform/keenetic adapters only; no systemd. fail-open remains default.
  - CGO_ENABLED=0. No new go.mod dependencies. Tests without a live router.
  - Do not edit packaging/control/** (H). Do not merge main. Push only agent/r6/service-keenetic. R6-I is not started by this agent.

do_not:
  - iptables -F or non-BTKN_ chains
  - stop or modify XKeen from the production daemon
  - own IPK control/postinst (H)
  - live Apply capture on KN-1011
  - change global swappiness
  - add Go modules
  - merge any branch
